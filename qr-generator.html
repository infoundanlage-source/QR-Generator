<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#006A6A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>QR-Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root {
  --primary:            #006A6A;
  --on-primary:         #FFFFFF;
  --primary-container:  #6FF7F6;
  --on-primary-container: #002020;
  --secondary:          #4A6363;
  --secondary-container:#CCE8E7;
  --on-secondary-container: #051F1F;
  --surface:            #F4FBFA;
  --surface-container-low: #EEF4F3;
  --surface-container:  #E8EEED;
  --surface-container-high: #E2E8E7;
  --on-surface:         #191C1C;
  --on-surface-variant: #3F4948;
  --outline:            #6F7979;
  --outline-variant:    #BEC8C8;
  --shadow:             rgba(0,32,32,.08);
  --shadow-strong:      rgba(0,32,32,.18);
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-full: 999px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --surface:            #1a1a1a;
    --surface-container-low: #252525;
    --surface-container:  #2d2d2d;
    --surface-container-high: #353535;
    --on-surface:         #e0e0e0;
    --on-surface-variant: #a8a8a8;
    --primary-container:  #004d4d;
    --on-primary-container: #6ff7f6;
    --secondary-container:#2d4747;
    --on-secondary-container: #b0d5d5;
    --outline:            #6f7979;
    --shadow:             rgba(0,0,0,.24);
    --shadow-strong:      rgba(0,0,0,.4);
  }
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--surface);
  color: var(--on-surface);
  min-height: 100dvh;
  overscroll-behavior: none;
  padding: 16px;
  background-image:
    radial-gradient(ellipse 700px 300px at 5% -5%, rgba(0,106,106,.07) 0%, transparent 60%),
    radial-gradient(ellipse 500px 250px at 95% 105%, rgba(75,96,124,.05) 0%, transparent 55%);
}
@media (prefers-color-scheme: dark) {
  body {
    background-image:
      radial-gradient(ellipse 600px 300px at 5% -5%, rgba(106,255,246,.06) 0%, transparent 65%),
      radial-gradient(ellipse 500px 250px at 95% 105%, rgba(75,96,124,.04) 0%, transparent 60%);
  }
}
body, button, input, textarea { touch-action: manipulation; }

.app-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 0;
  border-bottom: 1px solid var(--surface-container-high);
  flex-shrink: 0;
}
.logo {
  flex-shrink: 0;
  width: 48px; height: 48px;
  border-radius: 12px;
  background: var(--primary-container);
  color: var(--on-primary-container);
  display: grid; place-items: center;
  box-shadow: 0 2px 6px var(--shadow);
  font-size: 28px;
}
.header-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
}
.header-text h1 {
  margin: 0;
  font-size: 20px; font-weight: 800;
  letter-spacing: -.02em; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

main {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
}

.card {
  background: var(--surface-container-low);
  border-radius: var(--r-xl);
  padding: 18px;
  box-shadow: 0 1px 3px var(--shadow);
  border: 1px solid var(--surface-container-high);
  transition: box-shadow .2s ease;
}
.card:hover {
  box-shadow: 0 2px 8px var(--shadow-strong);
}
.card-title {
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 14px;
  font-size: 14px; font-weight: 700; letter-spacing: -.01em;
}
.card-title .material-symbols-rounded { color: var(--primary); font-size: 20px; }

.field { margin-bottom: 13px; }
.field:last-child { margin-bottom: 0; }
.field-label {
  display: block;
  font-size: 11px; font-weight: 700;
  color: var(--on-surface-variant);
  margin-bottom: 6px; padding-left: 2px;
  text-transform: uppercase; letter-spacing: .05em;
}
textarea, input[type="number"] {
  width: 100%;
  font-family: inherit;
  font-size: 15px; font-weight: 500;
  color: var(--on-surface);
  background: var(--surface-container);
  border: 2px solid transparent;
  border-radius: var(--r-md);
  padding: 12px 14px;
  outline: none;
  -webkit-appearance: none; appearance: none;
  transition: border-color .2s, background .2s, box-shadow .2s;
}
textarea { min-height: 80px; line-height: 1.4; resize: vertical; }
textarea:hover, input:hover { background: var(--surface); }
textarea:focus, input:focus {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(0, 106, 106, 0.1);
}
textarea::placeholder, input::placeholder { color: var(--outline); font-weight: 500; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

.suffix-wrap { position: relative; }
.suffix-wrap input { padding-right: 50px; }
.suffix {
  position: absolute; right: 14px; top: 50%;
  transform: translateY(-50%);
  font-size: 12px; font-weight: 600;
  color: var(--on-surface-variant); pointer-events: none;
}

.counter {
  font-size: 11px; font-weight: 500;
  color: var(--on-surface-variant);
  text-align: right; margin-top: 4px;
}

.chip-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.chip {
  border: 1.5px solid var(--outline-variant);
  background: transparent;
  color: var(--on-surface);
  font-family: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 12px; border-radius: 20px; cursor: pointer;
  transition: all .15s ease;
}
.chip:hover { background: var(--surface-container); border-color: var(--outline); }
.chip:active { transform: scale(.95); }
.chip.active {
  background: var(--secondary-container);
  border-color: var(--secondary-container);
  color: var(--on-secondary-container);
}

/* Checkbox */
.checkbox-row {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
}
.checkbox-input {
  width: 20px; height: 20px;
  cursor: pointer;
  accent-color: var(--primary);
}
.checkbox-label {
  font-size: 13px; font-weight: 500;
  color: var(--on-surface);
  cursor: pointer;
  user-select: none;
}

.preview-wrap {
  background: var(--surface-container);
  border-radius: var(--r-lg);
  padding: 14px;
  display: flex; flex-direction: column; align-items: center;
  border: 1px solid var(--surface-container-high);
}

.preview-col-title {
  font-size: 10px; font-weight: 700;
  color: var(--on-surface-variant);
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 10px;
}

.dymo-frame {
  width: 100%;
  max-width: 800px;
  aspect-ratio: 57 / 32;
  background: white;
  border-radius: 8px;
  box-shadow: 0 1px 2px var(--shadow), 0 4px 12px var(--shadow-strong);
  overflow: hidden;
  border: 1px solid rgba(0,0,0,.04);
}
.dymo-frame canvas { width: 100%; height: 100%; display: block; }

.png-frame {
  background: white;
  border-radius: 8px;
  box-shadow: 0 1px 2px var(--shadow), 0 4px 12px var(--shadow-strong);
  overflow: hidden;
  border: 1px solid rgba(0,0,0,.04);
  max-width: 300px;
  width: 100%;
  margin: 0 auto;
}
.png-frame canvas { width: 100%; height: auto; display: block; }

.preview-meta {
  font-size: 9px; font-weight: 600;
  color: var(--on-surface-variant);
  text-align: center;
  letter-spacing: .06em; text-transform: uppercase;
  margin-top: 6px;
}

.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 14px;
}

.btn {
  border: none;
  font-family: inherit;
  font-size: 14px; font-weight: 700;
  letter-spacing: .01em;
  padding: 14px 16px;
  border-radius: var(--r-full);
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-content: center;
  transition: all .2s ease;
  min-height: 44px;
  white-space: nowrap;
}
.btn .material-symbols-rounded { font-size: 18px; pointer-events: none; }
.btn:hover {
  transform: translateY(-2px);
}
.btn:active {
  transform: scale(.97) translateY(0);
}
.btn:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: 0 2px 8px var(--shadow-strong);
}
.btn-primary:hover {
  box-shadow: 0 4px 16px var(--shadow-strong);
}

.btn-tonal {
  background: var(--secondary-container);
  color: var(--on-secondary-container);
  box-shadow: 0 1px 3px var(--shadow);
}
.btn-tonal:hover {
  background: var(--surface-container-high);
  box-shadow: 0 2px 8px var(--shadow);
}

.float-btn {
  position: fixed;
  z-index: 100;
  touch-action: none;
  cursor: grab;
}
.float-btn.is-dragging {
  cursor: grabbing;
  transform: scale(1.06) !important;
  box-shadow: 0 16px 40px var(--shadow-strong) !important;
  opacity: 0.94;
  z-index: 200;
}

@media (min-width: 1000px) {
  .float-btn {
    position: static;
  }
}

.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(160%);
  background: var(--on-surface); color: var(--surface);
  padding: 10px 18px;
  border-radius: var(--r-full);
  font-size: 12px; font-weight: 600;
  box-shadow: 0 8px 24px var(--shadow-strong);
  transition: transform .3s cubic-bezier(.2,.8,.2,1);
  z-index: 300;
  display: inline-flex; align-items: center; gap: 8px;
  white-space: nowrap;
  max-width: calc(100vw - 32px);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast .material-symbols-rounded { font-size: 16px; color: var(--primary-container); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--outline-variant);
  border-radius: 4px;
  border: 2px solid var(--surface);
}
::-webkit-scrollbar-thumb:hover { background: var(--outline); }

@media (max-width: 380px) {
  body { padding: 12px; }
  .card { padding: 14px; }
  .header-text h1 { font-size: 18px; }
  .btn { font-size: 13px; padding: 12px; }
  .btn-row {
    grid-template-columns: 1fr;
  }
}

@media (min-width: 1000px) {
  body { padding: 24px; }
  .app-wrapper { gap: 20px; }
  .card { padding: 22px; }
  .dymo-frame { max-width: 900px; }
  .btn { font-size: 15px; padding: 16px 24px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="app-wrapper">

  <header>
    <div class="logo">
      <span class="material-symbols-rounded">qr_code_2</span>
    </div>
    <div class="header-text">
      <h1>QR-Generator</h1>
    </div>
  </header>

  <main>

    <!-- EINGABE -->
    <article class="card">
      <h2 class="card-title">
        <span class="material-symbols-rounded">edit</span>
        Inhalt
      </h2>
      <div class="field">
        <label class="field-label" for="text">QR-Code Text</label>
        <textarea id="text"
                  placeholder="URL, Text oder Nummer…"
                  autocomplete="off" autocapitalize="sentences"
                  spellcheck="false" enterkeyhint="done">Hautgefühl Warburg</textarea>
        <div class="counter" id="counter">0 Zeichen</div>
      </div>
    </article>

    <!-- PNG-EINSTELLUNGEN + CHECKBOX + BUTTONS -->
    <article class="card">
      <h2 class="card-title">
        <span class="material-symbols-rounded">image</span>
        PNG-Größe
      </h2>
      <div class="field">
        <label class="field-label" for="pngSize">Größe (mm)</label>
        <div class="suffix-wrap">
          <input type="number" id="pngSize"
                 inputmode="numeric" pattern="[0-9]*"
                 min="5" max="40" step="1" value="20"
                 enterkeyhint="done">
          <span class="suffix">mm</span>
        </div>
        <div class="chip-row" id="sizeChips">
          <button type="button" class="chip" data-size="5">5</button>
          <button type="button" class="chip" data-size="15">15</button>
          <button type="button" class="chip" data-size="20">20</button>
          <button type="button" class="chip" data-size="25">25</button>
          <button type="button" class="chip" data-size="30">30</button>
          <button type="button" class="chip" data-size="35">35</button>
          <button type="button" class="chip active" data-size="40">40</button>
        </div>
      </div>

      <!-- Checkbox -->
      <div class="checkbox-row">
        <input type="checkbox" id="showTextInPng" class="checkbox-input">
        <label for="showTextInPng" class="checkbox-label">QR-Code PNG-Datei optional</label>
      </div>

      <!-- Button Row: PDF Links, PNG Rechts -->
      <div class="btn-row">
        <button class="btn btn-primary float-btn" id="btnPdf">
          <span class="material-symbols-rounded">picture_as_pdf</span>
          PDF drucken
        </button>
        <button class="btn btn-tonal float-btn" id="btnPng">
          <span class="material-symbols-rounded">image</span>
          PNG speichern
        </button>
      </div>
    </article>

    <!-- DYMO-LABEL VORSCHAU -->
    <article class="card">
      <h2 class="card-title">
        <span class="material-symbols-rounded">local_printshop</span>
        Dymo-Label
      </h2>
      <div class="preview-wrap">
        <div class="preview-col-title">57 × 32 mm · Druckversion</div>
        <div class="dymo-frame">
          <canvas id="previewDymo"></canvas>
        </div>
        <div class="preview-meta">57:32 Seitenverhältnis</div>
      </div>
    </article>

    <!-- PNG-VORSCHAU -->
    <article class="card">
      <h2 class="card-title">
        <span class="material-symbols-rounded">image_search</span>
        PNG-Vorschau
      </h2>
      <div class="preview-wrap">
        <div class="preview-col-title" id="pngMeta">20 × 20 mm</div>
        <div class="png-frame">
          <canvas id="previewPng"></canvas>
        </div>
        <div class="preview-meta">300 DPI</div>
      </div>
    </article>

  </main>

</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="material-symbols-rounded">check_circle</span>
  <span id="toastMsg">OK</span>
</div>

<script>
'use strict';

const LABEL = {
  width: 57, height: 32,
  qrSize: 22, qrTop: 1.5,
  textGap: 1.0, textPadBottom: 1.0,
  fontMin: 4.5, fontMax: 9
};

const els = {
  text: document.getElementById('text'),
  pngSize: document.getElementById('pngSize'),
  counter: document.getElementById('counter'),
  dymoCanvas: document.getElementById('previewDymo'),
  pngCanvas: document.getElementById('previewPng'),
  pngMeta: document.getElementById('pngMeta'),
  btnPdf: document.getElementById('btnPdf'),
  btnPng: document.getElementById('btnPng'),
  showTextInPng: document.getElementById('showTextInPng'),
  toast: document.getElementById('toast'),
  toastMsg: document.getElementById('toastMsg'),
  chips: document.querySelectorAll('#sizeChips .chip')
};

function showToast(msg) {
  els.toastMsg.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2200);
}

function haptic(p) {
  if (navigator.vibrate) try { navigator.vibrate(p); } catch(_) {}
}

function makeQR(text, sizePx) {
  return new QRious({
    value: text.length > 0 ? text : ' ',
    size: sizePx, level: 'M',
    background: '#FFFFFF', foreground: '#000000', padding: 0
  }).canvas;
}

function wrapText(ctx, text, maxW) {
  const lines = [];
  for (const para of String(text).split(/\r?\n/)) {
    if (!para.trim()) { lines.push(''); continue; }
    let cur = '';
    for (const word of para.split(/\s+/).filter(Boolean)) {
      const test = cur ? cur + ' ' + word : word;
      if (ctx.measureText(test).width <= maxW) { cur = test; }
      else {
        if (cur) lines.push(cur);
        if (ctx.measureText(word).width > maxW) {
          let chunk = '';
          for (const ch of word) {
            if (ctx.measureText(chunk + ch).width <= maxW) chunk += ch;
            else { if (chunk) lines.push(chunk); chunk = ch; }
          }
          cur = chunk;
        } else { cur = word; }
      }
    }
    if (cur) lines.push(cur);
  }
  return lines;
}

function fitFont(ctx, text, maxW, maxH, minPx, maxPx) {
  let lo = minPx, hi = maxPx, best = minPx, bestLines = [];
  while (lo <= hi) {
    const mid = (lo + hi) / 2;
    ctx.font = `500 ${mid}px Manrope,Helvetica,Arial,sans-serif`;
    const lines = wrapText(ctx, text, maxW);
    if (lines.length * mid * 1.18 <= maxH) { best = mid; bestLines = lines; lo = mid + 0.25; }
    else { hi = mid - 0.25; }
  }
  ctx.font = `500 ${best}px Manrope,Helvetica,Arial,sans-serif`;
  return { fontPx: best, lines: bestLines.length ? bestLines : wrapText(ctx, text, maxW) };
}

function renderDymo() {
  const text = els.text.value;
  const canvas = els.dymoCanvas;
  const ctx = canvas.getContext('2d');
  const SC = 24, dpr = window.devicePixelRatio || 1;
  const W = LABEL.width * SC, H = LABEL.height * SC;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = '#FFF'; ctx.fillRect(0, 0, W, H);

  const qs = LABEL.qrSize * SC;
  const qx = (W - qs) / 2, qy = LABEL.qrTop * SC;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(makeQR(text, qs * 2), qx, qy, qs, qs);

  if (text.trim()) {
    const tTop = qy + qs + LABEL.textGap * SC;
    const tH = H - tTop - LABEL.textPadBottom * SC;
    const fit = fitFont(ctx, text, qs, tH, LABEL.fontMin * SC * .3528, LABEL.fontMax * SC * .3528);
    const lh = fit.fontPx * 1.18;
    const totalH = fit.lines.length * lh;
    let y = tTop + (tH - totalH) / 2;
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const line of fit.lines) { ctx.fillText(line, W / 2, y); y += lh; }
  }
}

function renderPng() {
  const text = els.text.value;
  const showText = els.showTextInPng.checked;
  const canvas = els.pngCanvas;
  const ctx = canvas.getContext('2d');
  const QR_SIZE = 240;
  const dpr = window.devicePixelRatio || 1;
  
  // Text-Berechnung wenn aktiviert
  let textHeight = 0;
  let textLines = [];
  let fontSize = 20;
  
  if (showText && text.trim()) {
    ctx.font = `${fontSize}px Manrope,Helvetica,Arial,sans-serif`;
    textLines = wrapText(ctx, text, QR_SIZE);
    
    // Font-Größe so anpassen, dass Text lesbar und skaliert ist
    while (fontSize > 10) {
      ctx.font = `${fontSize}px Manrope,Helvetica,Arial,sans-serif`;
      const lines = wrapText(ctx, text, QR_SIZE);
      const lineH = fontSize * 1.3;
      const totalH = lines.length * lineH + 16;
      if (totalH <= 120) break; // max 120px für Text
      fontSize -= 1;
    }
    
    ctx.font = `${fontSize}px Manrope,Helvetica,Arial,sans-serif`;
    textLines = wrapText(ctx, text, QR_SIZE);
    textHeight = textLines.length * fontSize * 1.3 + 16;
  }
  
  const totalHeight = QR_SIZE + textHeight;
  canvas.width = QR_SIZE * dpr;
  canvas.height = totalHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  // QR-Code
  ctx.fillStyle = '#FFF';
  ctx.fillRect(0, 0, QR_SIZE, totalHeight);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(makeQR(text, QR_SIZE * 2), 0, 0, QR_SIZE, QR_SIZE);
  
  // Text (wenn aktiviert)
  if (showText && text.trim() && textHeight > 0) {
    ctx.fillStyle = '#000';
    ctx.font = `${fontSize}px Manrope,Helvetica,Arial,sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    
    const lineH = fontSize * 1.3;
    const totalTextH = textLines.length * lineH;
    let y = QR_SIZE + (textHeight - totalTextH) / 2;
    
    for (const line of textLines) {
      ctx.fillText(line, QR_SIZE / 2, y);
      y += lineH;
    }
  }
}

function updatePngMeta() {
  let mm = parseFloat(els.pngSize.value) || 20;
  mm = Math.min(Math.max(mm, 5), 40);
  const px = Math.round(mm * 11.811);
  
  if (els.showTextInPng.checked) {
    els.pngMeta.textContent = `${mm} × ${mm}+ mm (mit Text)`;
  } else {
    els.pngMeta.textContent = `${mm} × ${mm} mm`;
  }
}

function renderAll() { renderDymo(); renderPng(); }

function syncChips() {
  const v = parseInt(els.pngSize.value, 10);
  els.chips.forEach(c => c.classList.toggle('active', +c.dataset.size === v));
}

els.chips.forEach(c => c.addEventListener('click', () => {
  els.pngSize.value = c.dataset.size;
  syncChips(); updatePngMeta(); haptic(8);
}));

// Checkbox Event Listener
els.showTextInPng.addEventListener('change', () => {
  updatePngMeta();
  renderPng();
  haptic(8);
});

async function saveFile(blob, filename, mime, label) {
  if (navigator.canShare && navigator.share) {
    try {
      const f = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [f] })) {
        await navigator.share({ files: [f], title: filename });
        haptic(20); showToast(label + ' geteilt'); return;
      }
    } catch (err) {
      if (err && err.name === 'AbortError') return;
    }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    haptic(20); showToast(label + ' gespeichert');
  } catch (_) {
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    showToast('Datei geöffnet – lang tippen zum Speichern');
  }
}

function exportPDF() {
  const text = els.text.value.trim();
  if (!text) { showToast('Bitte Text eingeben'); haptic(40); return; }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm',
    format: [LABEL.width, LABEL.height], compress: true });

  const qrX = (LABEL.width - LABEL.qrSize) / 2, qrY = LABEL.qrTop;
  pdf.addImage(makeQR(text, 800).toDataURL('image/png'),
    'PNG', qrX, qrY, LABEL.qrSize, LABEL.qrSize, undefined, 'FAST');

  pdf.setFont('helvetica', 'normal');
  const tTop = qrY + LABEL.qrSize + LABEL.textGap;
  const tH = LABEL.height - tTop - LABEL.textPadBottom;
  const maxW = LABEL.qrSize;
  let pt = LABEL.fontMax, lines;
  while (pt >= LABEL.fontMin) {
    pdf.setFontSize(pt);
    lines = pdf.splitTextToSize(text, maxW);
    if (lines.length * pt * .3528 * 1.15 <= tH) break;
    pt -= .25;
  }
  pdf.setFontSize(pt);
  lines = pdf.splitTextToSize(text, maxW);
  const lh = pt * .3528 * 1.15;
  const startY = tTop + (tH - lines.length * lh) / 2 + pt * .3528 * .85;
  pdf.text(lines, LABEL.width / 2, startY, { align: 'center', maxWidth: maxW });

  const safe = text.trim().replace(/[/\\:*?"<>|]/g, '');
  const filename = `${safe}.pdf`;
  saveFile(pdf.output('blob'), filename, 'application/pdf', 'PDF');
}

function exportPNG() {
  const text = els.text.value.trim();
  if (!text) { showToast('Bitte Text eingeben'); haptic(40); return; }
  let mm = parseFloat(els.pngSize.value);
  if (!isFinite(mm) || mm <= 0) mm = 20;
  mm = Math.min(Math.max(mm, 5), 40);
  const px = Math.round(mm * 11.811);
  const safe = text.trim().replace(/[/\\:*?"<>|]/g, '');
  const filename = `${safe}.png`;
  makeQR(text, px).toBlob(blob => {
    if (!blob) { showToast('PNG-Fehler'); return; }
    saveFile(blob, filename, 'image/png', `PNG`);
  }, 'image/png');
}

function makeDraggable(el, onTap, defaultSideFn) {
  const KEY = 'float-pos-' + el.id;
  let isDragging = false, moved = false, longTimer = null;
  let startPX = 0, startPY = 0, startBX = 0, startBY = 0;
  const LONG_MS = 350, CANCEL_PX = 10;

  function clamp(x, y) {
    const W = window.innerWidth, H = window.innerHeight;
    const bw = el.offsetWidth, bh = el.offsetHeight;
    return {
      x: Math.max(4, Math.min(W - bw - 4, x)),
      y: Math.max(4, Math.min(H - bh - 4, y))
    };
  }
  function setPos(x, y) {
    const p = clamp(x, y);
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
  }
  function savePos() {
    const r = el.getBoundingClientRect();
    try { localStorage.setItem(KEY, JSON.stringify({ x: r.left, y: r.top })); } catch(_) {}
  }
  function loadPos() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && isFinite(s.x) && isFinite(s.y)) { setPos(s.x, s.y); return; }
    } catch(_) {}
    requestAnimationFrame(() => {
      const { x, y } = defaultSideFn();
      setPos(x, y);
    });
  }

  el.addEventListener('pointerdown', e => {
    const r = el.getBoundingClientRect();
    startPX = e.clientX; startPY = e.clientY;
    startBX = r.left; startBY = r.top;
    moved = false; isDragging = false;
    longTimer = setTimeout(() => {
      isDragging = true;
      try { el.setPointerCapture(e.pointerId); } catch(_) {}
      el.classList.add('is-dragging');
      haptic(18);
    }, LONG_MS);
  });

  el.addEventListener('pointermove', e => {
    const dx = e.clientX - startPX, dy = e.clientY - startPY;
    if (!isDragging) {
      if (Math.abs(dx) > CANCEL_PX || Math.abs(dy) > CANCEL_PX) clearTimeout(longTimer);
      return;
    }
    e.preventDefault();
    moved = true;
    setPos(startBX + dx, startBY + dy);
  }, { passive: false });

  el.addEventListener('pointerup', e => {
    clearTimeout(longTimer);
    if (isDragging) {
      isDragging = false;
      el.classList.remove('is-dragging');
      try { el.releasePointerCapture(e.pointerId); } catch(_) {}
      if (moved) { savePos(); haptic([8, 20, 8]); showToast('Position gespeichert'); }
    } else {
      onTap();
    }
  });

  el.addEventListener('pointercancel', () => {
    clearTimeout(longTimer);
    isDragging = false;
    el.classList.remove('is-dragging');
  });

  el.addEventListener('contextmenu', e => { e.preventDefault(); });
  loadPos();
}

window.addEventListener('load', () => {
  els.counter.textContent = `${els.text.value.length} Zeichen`;
  syncChips(); updatePngMeta(); renderAll();

  els.text.addEventListener('input', () => {
    els.counter.textContent = `${els.text.value.length} Zeichen`;
    renderAll();
  });
  els.pngSize.addEventListener('input', () => { syncChips(); updatePngMeta(); });
  [els.text, els.pngSize].forEach(inp => inp.addEventListener('focus', () => {
    setTimeout(() => inp.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 300);
  }));

  els.btnPdf.addEventListener('click', exportPDF);
  els.btnPng.addEventListener('click', exportPNG);

  const isDesktop = window.innerWidth >= 1000;
  if (!isDesktop) {
    const W = () => window.innerWidth, H = () => window.innerHeight;
    makeDraggable(els.btnPdf, exportPDF, () => ({
      x: W() - els.btnPdf.offsetWidth - 16,
      y: H() - els.btnPdf.offsetHeight - 28
    }));
    makeDraggable(els.btnPng, exportPNG, () => ({
      x: 16,
      y: H() - els.btnPng.offsetHeight - 28
    }));
    if (!localStorage.getItem('drag-hint-seen')) {
      setTimeout(() => {
        showToast('⬆ Gedrückt halten zum Verschieben');
        localStorage.setItem('drag-hint-seen', '1');
      }, 900);
    }
  }

  window.addEventListener('orientationchange', () => setTimeout(renderAll, 200));
});
document.fonts && document.fonts.ready.then(renderAll);
</script>
